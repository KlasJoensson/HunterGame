# GC9A01 is driven over the MIPI DBI SPI (Mode C) emulation layer
# TODO 1: Configure use of MIPI Display Bus Interface and use GC9X01X display
CONFIG_MIPI_DBI=y
CONFIG_GC9X01X=y

# Bring-up diagnostics: trace display + MIPI DBI init and expose the
# `device` shell command so `device list` shows if gc9a01 is ready
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_DEVICE_SHELL=y
